---
name: Build and Push Docker Image
run-name: Build ${{ github.ref_name }}
#
# "Continuous Integration workflow for building, the project."
#
# Jobs included:
# - seed: calculate the EPOCH seed
# - build: building the images
# - merge: merge the per-arch images into a multi-arch image
#
# Required Secrets:
# NONE

on:  # yamllint disable-line rule:truthy
  push:
    branches: ["*-Ash", "feature-*", "patch-*"]  # matches any branch
    tags: ["v*"]
  pull_request:
    branches: ["patch-*", "feature-*", "MuslLike-Ash"]

# Declare default permissions as none.
permissions: {}

jobs:
  seed:
    permissions:
      actions: read
      contents: read
      packages: none
      pull-requests: read
      security-events: none
    runs-on: ubuntu-slim
    outputs:
      timestamp: ${{ steps.output_time.outputs.bootstrap-timestamp }}
      bsdlike-ash-timestamp: ${{ steps.output_time.outputs.bsdlike-ash-timestamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - id: output_time
        name: Get Git commit timestamps
        shell: bash
        run: |
          printf "%s\n" "::group::bootstrap-bsdlike-ash-env"
          printf "bootstrap-timestamp=%s\n" $(git log -1 --pretty=%ct) >> "$GITHUB_OUTPUT"
          printf "TIMESTAMP=%s\n" $(git log -1 --pretty=%ct) >> "$GITHUB_ENV"
          printf "bsdlike-ash-timestamp=%s %s\n" $(date -j -f "%s" "$(git log -1 --pretty=%ct)" "+%C%y-%d-%m %H:%M:%S") >> "$GITHUB_OUTPUT"
          printf "%s %s\n" "bsdlike-ash will be synced at time of:" $(date -j -f "%s" "$(git log -1 --pretty=%ct)" "+%C%y-%d-%m %H:%M:%S")
          printf "%s\n" "::endgroup::"

  build:
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
      security-events: none
    needs: seed
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Prepare
        id: prep_output
        run: |
          platform=linux/${{ matrix.architecture }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Create swap
        id: swap_8g_on
        if: ${{ (env.USE_SWAP == 'true') && !cancelled() }}
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo -k 2>/dev/null ;

        # QEMU setup only for armv7 emulation
      - name: Set up QEMU (for armv7)
        if: ${{ matrix.architecture == 'arm' }}
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          platforms: linux/${{ matrix.architecture }}
          cleanup: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          context: git
          images: ghcr.io/reactive-firewall/bsdlike-ash
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/reactive-firewall/bsdlike-ash
          platforms: linux/${{ matrix.architecture }}
          build-args: |
            TARGETARCH=${{ matrix.architecture }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          attests: |
            type=sbom
            type=provenance
          sbom: true
          provenance: mode=max
          push: true
          annotations: |
            index.org.opencontainers.image.title=BSDLike Ash
            index.org.opencontainers.image.authors=reactive-firewall@users.noreply.github.com
            index.org.opencontainers.image.description=MuslLike Ash on alpine linux
            index.org.opencontainers.image.vendor=individual
            index.org.opencontainers.image.licenses="Apache-2.0 AND MITFNA"
            org.opencontainers.image.title=BSDLike Ash
            org.opencontainers.image.authors=reactive-firewall@users.noreply.github.com
            org.opencontainers.image.description=MuslLike Ash on alpine linux
            org.opencontainers.image.vendor=individual
            org.opencontainers.image.licenses="Apache-2.0 AND MIT"
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,annotation-index.org.opencontainers.image.description=Multi-arch MuslLike Ash build image ${{ matrix.architecture }}
        env:
          SOURCE_DATE_EPOCH: ${{ needs.seed.outputs.timestamp }}
          ASH_DATE_EPOCH: ${{ needs.seed.outputs.bsdlike-ash-timestamp }}
          TARGETARCH: ${{ matrix.architecture }}
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Logout from Docker Hub
        if: ${{ always() }}
        run: docker logout

      - name: Remove swap
        id: swap_8g_off
        if: ${{ (env.USE_SWAP == 'true') && always() }}
        run: |
          sudo swapoff /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M status=progress count=8192 || sudo sh -c 'cat /dev/zero > /swapfile'
          sudo sync ;
          sudo rm /swapfile ;
          sudo sync ;
          sudo -k 2>/dev/null ;

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
      security-events: none
    runs-on: ubuntu-latest
    needs: build
    outputs:
      merge_version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          context: git
          images: ghcr.io/reactive-firewall/bsdlike-ash
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
        env:
          SOURCE_DATE_EPOCH: ${{ needs.seed.outputs.timestamp }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE_DATE_EPOCH: ${{ needs.seed.outputs.timestamp }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/reactive-firewall/bsdlike-ash@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/reactive-firewall/bsdlike-ash:${{ steps.meta.outputs.version }}

      - name: Ensure image is pullable locally
        run: |
          # ensure the platform-specific image manifest is present locally for Syft/Grype
          docker pull ghcr.io/reactive-firewall/bsdlike-ash:${{ steps.meta.outputs.version }}

      - name: Pull Syft and Grype images
        run: |
          # ensure the Syft and Grype images are available
          docker pull anchore/syft:v1.45.1
          docker pull anchore/grype:v0.114.0

      - name: Generate SBOM (Syft) for this architecture
        env:
          IMAGE: ghcr.io/reactive-firewall/bsdlike-ash:${{ steps.meta.outputs.version }}
        run: |
          SYFT_IMG=anchore/syft:v1.45.1  # adjust version if desired
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            $SYFT_IMG ${IMAGE} -o spdx-json > sbom.json

      - name: Scan image with Grype (vulnerability) and export results
        env:
          IMAGE: ghcr.io/reactive-firewall/bsdlike-ash:${{ steps.meta.outputs.version }}
        run: |
          GRYPE_IMG=anchore/grype:v0.114.0
          # run grype against the image and produce JSON output
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            $GRYPE_IMG ${IMAGE} -o json > grype.json || true
          # (grype exits non-zero on findings; keep the job green by allowing non-zero)

      - name: Upload per-arch SBOM and Grype report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-scan
          path: |
            sbom.json

      - name: Logout from Docker Hub
        if: ${{ always() }}
        run: docker logout
